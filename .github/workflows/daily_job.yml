name: Täglicher Job-Agent

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Agenten ausführen
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        EMAIL_SENDER:  ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        TEST_MODE: "true" # Zum Testen aktiv lassen, später auf "false" setzen
      run: |
        python job_agent.py

    - name: Verlauf im Repository speichern
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "💾 Auto-Update: Job-Verlauf & Raw-Jobs aktualisiert [skip ci]"
        file_pattern: 'history_jobs.json raw_jobs.json'
        status_options: '--untracked-files=all'
        add_options: '-A'
