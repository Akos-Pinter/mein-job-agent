name: Täglicher Job-Agent

on:
  schedule:
    # Jeden Tag um 07:00 UTC (entspricht 08:00 Uhr deutscher Winterzeit)
    - cron: '0 7 * * *'
  workflow_dispatch: # Erlaubt es, den Agenten jederzeit manuell auf GitHub zu starten

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v3

    - name: Python installieren
      uses: actions/setup-python@v4
      with:
        python-node-version: '3.10'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Agenten ausführen
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python job_agent.py
